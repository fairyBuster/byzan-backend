  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      - id
      - username
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
    Chapter:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          readOnly: true
      required:
      - id
      - lessons
      - title
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        thumbnail:
          type: string
          format: uri
          nullable: true
        thumbnail_url:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
          readOnly: true
        total_lessons:
          type: string
          readOnly: true
        is_enrolled:
          type: string
          readOnly: true
        progress_percent:
          type: string
          readOnly: true
        instructor:
          type: string
          readOnly: true
        buyers_count:
          type: string
          readOnly: true
        rating_avg:
          type: string
          readOnly: true
        rating_count:
          type: string
          readOnly: true
      required:
      - buyers_count
      - chapters
      - created_at
      - description
      - id
      - instructor
      - is_enrolled
      - price
      - progress_percent
      - rating_avg
      - rating_count
      - thumbnail_url
      - title
      - total_lessons
    CourseComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
          readOnly: true
        user:
          type: string
          readOnly: true
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - comment
      - course
      - created_at
      - id
      - user
    CourseReview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
          readOnly: true
        user:
          type: string
          readOnly: true
        rating:
          type: integer
          maximum: 32767
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - created_at
      - id
      - rating
      - updated_at
      - user
    GenderEnum:
      enum:
      - male
      - female
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
    Lesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        youtube_url:
          type: string
          format: uri
          maxLength: 200
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        duration_seconds:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_completed:
          type: string
          readOnly: true
      required:
      - id
      - is_completed
      - title
      - youtube_url
    LessonQuestion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lesson:
          type: integer
          readOnly: true
        user:
          type: string
          readOnly: true
        question:
          type: string
        answer:
          type: string
          readOnly: true
        answered_by:
          type: string
          readOnly: true
        answered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer
      - answered_at
      - answered_by
      - created_at
      - id
      - lesson
      - question
      - user
